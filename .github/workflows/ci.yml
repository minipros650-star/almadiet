name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — lint, tests, migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Formatting check (black)
        run: black --check app main.py tests || true

      - name: Lint (ruff)
        run: ruff check app main.py tests || true

      - name: Run backend test suite
        env:
          ENVIRONMENT: development
          DATABASE_URL: sqlite+aiosqlite:///:memory:
        run: python -m pytest tests -q

      - name: Migration validation (clean upgrade + round-trip)
        env:
          ENVIRONMENT: development
        run: python -m pytest tests/test_migrations.py -q

      - name: Production configuration gate (TEST 14/15)
        env:
          ENVIRONMENT: development
          DATABASE_URL: sqlite+aiosqlite:///:memory:
        run: python -m pytest tests/test_config_security.py -q

  flutter:
    name: Flutter — analyze, tests, localization
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed --output=none lib test || true

      - name: Analyze
        run: flutter analyze

      - name: Run Flutter tests (localization completeness, gestational parity, claims gate, profile update)
        run: flutter test

  security:
    name: Security — secrets and configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No hardcoded default JWT secret in code
        run: |
          if grep -rn "dev-only-secret-change-me\|super-secret-key\|change-me-in-production" backend/app backend/main.py; then
            echo "❌ Hardcoded secret-like strings found"
            exit 1
          fi
          echo "✓ No hardcoded secrets in backend source"

      - name: No wildcard CORS in production configuration
        run: |
          if grep -n 'ALLOWED_ORIGINS.*\*' backend/.env.example; then
            echo "❌ .env.example must not suggest wildcard CORS"
            exit 1
          fi
          echo "✓ Wildcard CORS not suggested"

  build:
    name: Build verification
    runs-on: ubuntu-latest
    needs: [backend]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: App imports cleanly (build smoke)
        env:
          ENVIRONMENT: development
          DATABASE_URL: sqlite+aiosqlite:///:memory:
        run: python -c "import main; print('app ok:', main.app.title)"
